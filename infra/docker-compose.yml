version: "3.8"

services:
  # -----------------------------------------------------
  # 1. POSTGRESQL
  # -----------------------------------------------------
  postgres:
    image: postgres:15
    container_name: sme-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - private_net

  # -----------------------------------------------------
  # 2. KEYCLOAK
  # -----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: sme-idp
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}

      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASSWORD}

      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./idp/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - public_net
      - private_net

  # -----------------------------------------------------
  # 3. FASTAPI
  # -----------------------------------------------------
  backend:
    build:
      context: ../services/api-backend
      dockerfile: Dockerfile
    container_name: sme-backend
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
    volumes:
      - ./certs:/certs:ro    # <-- Kéo kho cert vào container
    command: >               # <-- Bật khiên mTLS cho Uvicorn
      uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --ssl-keyfile /certs/backend/backend.key 
      --ssl-certfile /certs/backend/backend_fullchain.crt 
      --ssl-ca-certs /certs/ca/root_ca.crt 
      --ssl-cert-reqs 2
    networks:
      - private_net

  # -----------------------------------------------------
  # 4. KONG
  # -----------------------------------------------------
  kong:
    image: kong:latest
    container_name: sme-gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001,0.0.0.0:8444 ssl
      
      # Chỉ cho phép TLS 1.3 (Tắt TLS 1.2, 1.1, 1.0)
      - KONG_SSL_PROTOCOLS="TLSv1.3"      
      - KONG_NGINX_PROXY_SSL_PROTOCOLS=TLSv1.3
      # Định nghĩa Cipher Suite (Chỉ dùng các thuật toán AEAD an toàn nhất)
      - KONG_SSL_CIPHERS="TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"  
      # Tắt tính năng 0-RTT của TLS 1.3 ở mức Nginx để chống Replay Attack
      - KONG_NGINX_HTTP_SSL_EARLY_DATA="off"

      # Khai báo Chứng chỉ cho mặt tiền của Kong (để phục vụ user bên ngoài)
      - KONG_SSL_CERT=/certs/kong/kong_fullchain.crt
      - KONG_SSL_CERT_KEY=/certs/kong/kong.key
      # Khai báo Root CA 
      - KONG_LUA_SSL_TRUSTED_CERTIFICATE=/certs/ca/root_ca.crt
      - KONG_LUA_SSL_VERIFY_DEPTH=1
    volumes:
      - ../gateway:/kong/declarative
      # Mount toàn bộ thư mục certs vào trong Kong
      - ./certs:/certs:ro
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    networks:
      - public_net
      - private_net

  # -----------------------------------------------------
  # 5. VAULT
  # -----------------------------------------------------
  vault:
    image: hashicorp/vault:1.13
    container_name: sme-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: vault server -dev
    networks:
      - private_net

networks:
  public_net:
    driver: bridge

  private_net:
    driver: bridge
    internal: true