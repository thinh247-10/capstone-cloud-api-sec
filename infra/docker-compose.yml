version: "3.8"

services:
  # -----------------------------------------------------
  # 1. POSTGRESQL (Chứa cả Keycloak DB & Backend DB)
  # -----------------------------------------------------
  postgres:
    image: postgres:15
    container_name: sme-db
    ports:                  # Nằm thẳng hàng với chữ image
      - "5432:5432"         # Thụt lề vào 2 ô space
    environment:
      # ... các biến environment ở đây
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    networks:
      - private_net
      - public_net

  # -----------------------------------------------------
  # 2. KEYCLOAK (Identity Provider)
  # -----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: sme-idp
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-postgres}
      - KC_DB_USERNAME=${DB_USER:-postgres}
      - KC_DB_PASSWORD=${DB_PASSWORD:-postgres}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./idp/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - public_net
      - private_net

  # -----------------------------------------------------
  # 3. BACKEND (FastAPI)
  # -----------------------------------------------------
  backend:
    build:
      context: ../services/api-backend
      dockerfile: Dockerfile
    container_name: sme-backend
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - postgres
    volumes:
      - ./certs:/certs:ro    
    command: >               
      uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --ssl-keyfile /certs/backend/backend.key 
      --ssl-certfile /certs/backend/backend_fullchain.crt 
      --ssl-ca-certs /certs/ca/root_ca.crt 
      --ssl-cert-reqs 2
    networks:
      - private_net

  # -----------------------------------------------------
  # 4. KONG GATEWAY
  # -----------------------------------------------------
  kong:
    image: kong:latest
    container_name: sme-gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001,0.0.0.0:8444 ssl
      - KONG_SSL_PROTOCOLS="TLSv1.3"      
      - KONG_NGINX_PROXY_SSL_PROTOCOLS=TLSv1.3
      - KONG_SSL_CIPHERS="TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"  
      - KONG_NGINX_HTTP_SSL_EARLY_DATA="off"
      - KONG_SSL_CERT=/certs/kong/kong_fullchain.crt
      - KONG_SSL_CERT_KEY=/certs/kong/kong.key
      - KONG_LUA_SSL_TRUSTED_CERTIFICATE=/certs/ca/root_ca.crt
      - KONG_LUA_SSL_VERIFY_DEPTH=1
    volumes:
      - ../gateway:/kong/declarative
      - ./certs:/certs:ro
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    networks:
      - public_net
      - private_net

  # -----------------------------------------------------
  # 5. HASHICORP VAULT (Kho lưu khóa)
  # -----------------------------------------------------
  vault:
    image: hashicorp/vault:1.13
    container_name: sme-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: vault server -dev
    networks:
      - private_net
      - public_net

  # -----------------------------------------------------
  # 6. OPEN POLICY AGENT (Phân quyền OPA)
  # -----------------------------------------------------
  opa:
    image: openpolicyagent/opa:latest
    container_name: sme-opa
    ports:
      - "8181:8181"
    command: "run --server --addr :8181 --log-level=debug /policies"
    volumes:
      - ../policies:/policies:ro    
    networks:
      - private_net
      - public_net

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true