version: "3.8"

services:
  # -----------------------------------------------------
  # 1. POSTGRESQL (Nơi lưu trữ của Keycloak & App)
  # -----------------------------------------------------
  postgres:
    image: postgres:15
    container_name: sme-db
    environment:
      # Lấy dữ liệu từ file .env
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - private_net
  # -----------------------------------------------------
  # 2. KEYCLOAK (Identity Provider)
  # -----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: sme-idp
    command: start-dev --import-realm
    environment:
      # Lấy dữ liệu từ file .env
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}

      # Cấu hình kết nối DB (Tái sử dụng các biến DB ở trên)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASSWORD}

      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./idp/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - public_net
      - private_net
  # -----------------------------------------------------
  # 3. FASTAPI (Backend Service)
  # -----------------------------------------------------
  backend:
    build:
      context: ../services/api-backend # Trỏ ra thư mục code backend
      dockerfile: Dockerfile
    container_name: sme-backend
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - private_net
  # -----------------------------------------------------
  # 4. KONG API GATEWAY (Người gác cổng)
  # -----------------------------------------------------
  kong:
    image: kong:latest
    container_name: sme-gateway
    environment:
      # Các thông số hệ thống tĩnh của Kong có thể giữ nguyên
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
    volumes:
      - ../gateway:/kong/declarative
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    networks:
      - public_net
      - private_net

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true 